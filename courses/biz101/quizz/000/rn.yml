question: Inzira zo kwishura zubatswe  kuburyo bw’amahera ya kera ni ?
answer: Keshi na keshi  vyishurwa n'abadandaza biciye ku mafaranga y'abajejwe kwishura
wrong_answers:
  - Keshi na keshi ni kubuntu kuko umukiriya ariha igiciro gitagwa n'umucuruzi .
  - Yishurwa n'umukiriya hambavu y'igiciro umucuruzi asaba
  - Yishurwa n'amashirahamwe y'amakarata yongera kugurisha amakuru y'abaguzi
explanation: |
  Nta kintu na kimwe ari kubuntu.  ubuhinga bwo kwishura bushizwe mu buryo bw’amahera ya kera bukoreshwa n’abagurisha batandukanye , nk’amashirahamwe y’amakarata n’amabanki asaba amahera azwi be hamwe/canke amahera bakata kuri buri rungika yose ufatiye kwijana.
